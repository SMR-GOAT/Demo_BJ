<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Bajr | الطلبات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script>
      try {
        var data = JSON.parse(localStorage.getItem("ebajr-demo") || "null");
        if (!data || !data.session || data.session.role !== "admin" || !data.session.loggedIn) {
          document.documentElement.classList.add("hide-admin");
        }
      } catch (error) {
        document.documentElement.classList.add("hide-admin");
      }
    </script>
  </head>
  <body data-page="orders">
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="./dashboard.html"><img class="logo" src="./e-bajr-logo.png" alt="E-Bajr" width="120" height="40" /></a>
        <nav class="main-nav" aria-label="القائمة">
          <a href="./dashboard.html">لوحة المتابعة</a>
          <a href="./orders.html">الطلبات</a>
          <a href="./create-order.html">طلب جديد</a>
          <a class="admin-link" href="./members.html">الأعضاء</a>
        </nav>
        <div class="session">
          <p class="session-meta"><span data-org></span><strong data-who></strong></p>
          <button class="btn btn-quiet btn-sm" type="button" data-logout>خروج</button>
        </div>
      </div>
    </header>
    <main class="page">
      <div class="wrap">
        <div class="title-row">
          <div>
            <h1>الطلبات النشطة</h1>
            <p class="muted">النشطة الآن: <bdi dir="ltr" id="active-count">0</bdi>. المسلّم والملغي يخرجان من هذه القائمة.</p>
          </div>
          <a class="btn" href="./create-order.html">طلب جديد</a>
        </div>
        <form id="search-form" class="search-bar" novalidate>
          <label class="field search-field">
            <span>بحث بآخر ثلاثة أرقام</span>
            <input id="search-input" type="text" inputmode="numeric" maxlength="3" dir="ltr" autocomplete="off" />
          </label>
          <button class="btn" type="submit">بحث</button>
          <button class="btn btn-quiet" id="clear-search" type="button">مسح</button>
        </form>
        <p id="form-alert" class="alert" role="status" hidden></p>
        <p id="orders-empty" class="muted" hidden>لا توجد طلبات نشطة.</p>
        <div class="table-wrap">
          <table class="data-table" id="orders-table">
            <thead>
              <tr>
                <th>الرقم</th>
                <th>وقت التسجيل</th>
                <th>الحالة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
      </div>
    </main>

    <dialog id="edit-dialog">
      <form id="edit-form" novalidate>
        <h2>تعديل رقم الطلب</h2>
        <p class="muted">متاح في حالتي جديد وقيد التجهيز، وبشرط ألا يطابق طلبًا نشطًا آخر.</p>
        <label class="field">
          <span>الرقم الجديد</span>
          <input name="number" class="pin-input" type="text" inputmode="numeric" maxlength="3" dir="ltr" autocomplete="off" aria-describedby="edit-error" required />
          <p id="edit-error" class="field-error" hidden></p>
        </label>
        <div class="row-actions">
          <button class="btn btn-quiet" type="button" data-close>تراجع</button>
          <button class="btn" type="submit">حفظ</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2>تأكيد</h2>
        <p data-confirm-text></p>
        <div class="row-actions">
          <button class="btn btn-quiet" value="cancel">تراجع</button>
          <button class="btn" value="ok">تأكيد</button>
        </div>
      </form>
    </dialog>

    <dialog id="history-dialog">
      <h2>سجل الحالة</h2>
      <ol class="history-list" id="history-list"></ol>
      <form method="dialog" style="margin-top: 1rem">
        <button class="btn btn-quiet" value="close">إغلاق</button>
      </form>
    </dialog>
    <script src="./app.js" defer></script>
  </body>
</html>
