<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Bajr | تعيين كلمة المرور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-page="reset">
    <main class="auth-wrap">
      <section class="auth-card" aria-labelledby="reset-title">
        <a href="./index.html"><img class="logo" src="./e-bajr-logo.png" alt="E-Bajr" width="120" height="40" /></a>
        <h1 id="reset-title">تعيين كلمة المرور</h1>
        <p class="muted">اكتب كلمة المرور الجديدة ثم أكدها.</p>
        <p id="form-alert" class="alert" role="status" hidden></p>
        <form id="reset-form" novalidate>
          <label class="field">
            <span>كلمة المرور الجديدة</span>
            <input name="password" type="password" autocomplete="new-password" aria-describedby="password-error" required />
            <p id="password-error" class="field-error" hidden></p>
          </label>
          <label class="field">
            <span>تأكيد كلمة المرور</span>
            <input name="confirm" type="password" autocomplete="new-password" aria-describedby="confirm-error" required />
            <p id="confirm-error" class="field-error" hidden></p>
          </label>
          <button class="btn btn-block" type="submit">حفظ كلمة المرور</button>
        </form>
        <div class="form-links">
          <a id="login-link" href="./login.html" hidden>الانتقال لتسجيل الدخول</a>
          <a href="./login.html">العودة لتسجيل الدخول</a>
        </div>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
