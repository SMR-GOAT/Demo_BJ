<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Bajr | استعادة كلمة المرور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-page="forgot">
    <main class="auth-wrap">
      <section class="auth-card" aria-labelledby="forgot-title">
        <a href="./index.html"><img class="logo" src="./e-bajr-logo.png" alt="E-Bajr" width="120" height="40" /></a>
        <h1 id="forgot-title">استعادة كلمة المرور</h1>
        <p class="muted">اكتب البريد الإلكتروني المسجّل لإرسال رابط تعيين كلمة المرور.</p>
        <p id="form-alert" class="alert" role="status" hidden></p>
        <form id="forgot-form" novalidate>
          <label class="field">
            <span>البريد الإلكتروني</span>
            <input name="email" type="email" autocomplete="email" inputmode="email" aria-describedby="email-error" required />
            <p id="email-error" class="field-error" hidden></p>
          </label>
          <button class="btn btn-block" type="submit">إرسال الرابط</button>
        </form>
        <div class="form-links">
          <a id="reset-link" href="./reset-password.html" hidden>متابعة إلى تعيين كلمة المرور</a>
          <a href="./login.html">العودة لتسجيل الدخول</a>
        </div>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
