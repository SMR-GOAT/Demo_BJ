<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Bajr | تعيين كلمة المرور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/style-CCO9BVZR.css">
  </head>
  <body data-page="reset" class="auth-screen">
    <main class="auth-wrap">
      <div class="auth-shell">
        <div class="auth-topbar">
          <a href="./index.html" aria-label="E-Bajr، الرئيسية"><img class="logo" src="./e-bajr-logo.png" alt="E-Bajr" width="120" height="40" /></a>
          <a class="auth-home" href="./index.html">العودة للرئيسية</a>
        </div>
        <section class="auth-card" aria-labelledby="reset-title">
          <header class="auth-heading">
            <h1 id="reset-title">كلمة مرور جديدة</h1>
            <p>اختر كلمة مرور لحسابك، ثم أعد كتابتها للتأكيد.</p>
          </header>
          <div class="auth-content">
            <p id="form-alert" class="alert" role="status" hidden></p>
            <form id="reset-form" novalidate>
              <div class="field">
                <label for="reset-password">كلمة المرور الجديدة</label>
                <div class="password-field">
                  <input id="reset-password" name="password" type="password" autocomplete="new-password" placeholder="كلمة المرور الجديدة" aria-describedby="password-error" required />
                  <button class="password-toggle" type="button" data-password-toggle aria-controls="reset-password" aria-pressed="false" aria-label="إظهار كلمة المرور الجديدة">إظهار</button>
                </div>
                <p id="password-error" class="field-error" hidden></p>
              </div>
              <div class="field">
                <label for="reset-confirm">تأكيد كلمة المرور</label>
                <div class="password-field">
                  <input id="reset-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور" aria-describedby="confirm-error" required />
                  <button class="password-toggle" type="button" data-password-toggle aria-controls="reset-confirm" aria-pressed="false" aria-label="إظهار تأكيد كلمة المرور">إظهار</button>
                </div>
                <p id="confirm-error" class="field-error" hidden></p>
              </div>
              <button class="btn btn-block auth-submit" type="submit">حفظ كلمة المرور</button>
            </form>
            <a id="login-link" class="btn btn-block auth-submit" href="./login.html" hidden>الانتقال لتسجيل الدخول</a>
          </div>
          <div class="auth-card-footer"><p><a href="./login.html">العودة لتسجيل الدخول</a></p></div>
        </section>
      </div>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
