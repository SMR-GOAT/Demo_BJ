<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Bajr | استعادة كلمة المرور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/style-CCO9BVZR.css">
  </head>
  <body data-page="forgot" class="auth-screen">
    <main class="auth-wrap">
      <div class="auth-shell">
        <div class="auth-topbar">
          <a href="./index.html" aria-label="E-Bajr، الرئيسية"><img class="logo" src="./e-bajr-logo.png" alt="E-Bajr" width="120" height="40" /></a>
          <a class="auth-home" href="./index.html">العودة للرئيسية</a>
        </div>
        <section class="auth-card" aria-labelledby="forgot-title">
          <header class="auth-heading">
            <h1 id="forgot-title">نسيت كلمة المرور؟</h1>
            <p>أدخل البريد المرتبط بحسابك لتبدأ استعادة الوصول إليه.</p>
          </header>
          <div class="auth-content">
            <p id="form-alert" class="alert" role="status" hidden></p>
            <form id="forgot-form" novalidate>
              <div class="field">
                <label for="forgot-email">البريد الإلكتروني</label>
                <input id="forgot-email" name="email" type="email" dir="ltr" autocomplete="email" inputmode="email" placeholder="name@example.com" aria-describedby="email-error" required />
                <p id="email-error" class="field-error" hidden></p>
              </div>
              <button class="btn btn-block auth-submit" type="submit">إرسال رابط الاستعادة</button>
            </form>
            <a id="reset-link" class="auth-result-link" href="./reset-password.html" hidden>متابعة تعيين كلمة المرور في العرض التجريبي</a>
          </div>
          <div class="auth-card-footer"><p>تذكّرت كلمة المرور؟ <a href="./login.html">تسجيل الدخول</a></p></div>
        </section>
      </div>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
