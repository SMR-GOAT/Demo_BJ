<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Bajr | تسجيل الدخول</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-page="login">
    <main class="auth-wrap">
      <section class="auth-card" aria-labelledby="login-title">
        <a href="./index.html"><img class="logo" src="./e-bajr-logo.png" alt="E-Bajr" width="120" height="40" /></a>
        <h1 id="login-title">تسجيل الدخول</h1>
        <p class="muted">ادخل باسم المستخدم أو البريد الإلكتروني مع كلمة المرور.</p>
        <p id="form-alert" class="alert" role="status" hidden></p>
        <form id="login-form" novalidate>
          <label class="field">
            <span>اسم المستخدم أو البريد الإلكتروني</span>
            <input name="identifier" type="text" autocomplete="username" aria-describedby="identifier-error" required />
            <p id="identifier-error" class="field-error" hidden></p>
          </label>
          <label class="field">
            <span>كلمة المرور</span>
            <input name="password" type="password" autocomplete="current-password" aria-describedby="password-error" required />
            <p id="password-error" class="field-error" hidden></p>
          </label>
          <button class="btn btn-block" type="submit">دخول</button>
        </form>
        <div class="form-links">
          <a href="./forgot-password.html">نسيت كلمة المرور؟</a>
          <a href="./signup.html">إنشاء حساب</a>
        </div>
        <p class="hint" style="margin-top: 1rem">بعد إنشاء المنشأة يمكن تجربة دور الموظف بالبريد sara@example.com</p>
        <button class="btn btn-quiet btn-sm" id="reset-demo" type="button">مسح بيانات التجربة</button>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
