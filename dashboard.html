<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Bajr | لوحة المتابعة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script>
      try {
        var data = JSON.parse(localStorage.getItem("ebajr-demo") || "null");
        if (!data || !data.session || data.session.role !== "admin" || !data.session.loggedIn) {
          document.documentElement.classList.add("hide-admin");
        }
      } catch (error) {
        document.documentElement.classList.add("hide-admin");
      }
    </script>
  </head>
  <body data-page="dashboard">
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="./dashboard.html"><img class="logo" src="./e-bajr-logo.png" alt="E-Bajr" width="120" height="40" /></a>
        <nav class="main-nav" aria-label="القائمة">
          <a href="./dashboard.html">لوحة المتابعة</a>
          <a href="./orders.html">الطلبات</a>
          <a href="./create-order.html">طلب جديد</a>
          <a class="admin-link" href="./members.html">الأعضاء</a>
        </nav>
        <div class="session">
          <p class="session-meta"><span data-org></span><strong data-who></strong></p>
          <button class="btn btn-quiet btn-sm" type="button" data-logout>خروج</button>
        </div>
      </div>
    </header>
    <main class="page">
      <div class="wrap">
        <div class="title-row">
          <div>
            <h1>لوحة المتابعة</h1>
            <p class="muted">الطلبات النشطة في منشأتك.</p>
          </div>
          <a class="btn" href="./create-order.html">طلب جديد</a>
        </div>
        <p id="staff-hint" class="alert" hidden>لتجربة صلاحية الموظف: اخرج ثم ادخل بالبريد sara@example.com</p>
        <section class="stats" aria-label="ملخص الطلبات">
          <article class="stat"><b id="stat-active">0</b><span>نشطة</span></article>
          <article class="stat"><b id="stat-new">0</b><span>جديد</span></article>
          <article class="stat"><b id="stat-preparing">0</b><span>قيد التجهيز</span></article>
          <article class="stat"><b id="stat-ready">0</b><span>جاهز للاستلام</span></article>
        </section>
        <section style="margin-top: 1.2rem">
          <div class="title-row">
            <h2>آخر الطلبات</h2>
            <a href="./orders.html">إدارة الطلبات</a>
          </div>
          <p id="recent-empty" class="muted" hidden>لا توجد طلبات نشطة.</p>
          <div class="table-wrap">
            <table class="data-table" id="recent-table">
              <thead>
                <tr><th>الرقم</th><th>وقت التسجيل</th><th>الحالة</th></tr>
              </thead>
              <tbody id="recent-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
