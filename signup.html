<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Bajr | إنشاء حساب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-page="signup" class="auth-screen">
    <main class="auth-wrap">
      <div class="auth-shell auth-shell-wide">
        <div class="auth-topbar">
          <a href="./index.html" aria-label="E-Bajr، الرئيسية"><img class="logo" src="./e-bajr-logo.png" alt="E-Bajr" width="120" height="40" /></a>
          <a class="auth-home" href="./index.html">العودة للرئيسية</a>
        </div>
        <section class="auth-card" aria-labelledby="signup-title">
          <header class="auth-heading">
            <h1 id="signup-title">ابدأ مع <bdi>E-Bajr</bdi></h1>
            <p>أنشئ حسابك، ثم أضف بيانات منشأتك لتبدأ متابعة الطلبات.</p>
          </header>
          <div class="auth-content">
            <p id="form-alert" class="alert" role="status" hidden></p>
            <form id="signup-form" novalidate>
              <div class="auth-fields">
                <div class="field">
                  <label for="signup-username">اسم المستخدم</label>
                  <input id="signup-username" name="username" type="text" autocomplete="username" placeholder="اختر اسم مستخدم" aria-describedby="username-error" required />
                  <p id="username-error" class="field-error" hidden></p>
                </div>
                <div class="field auth-field-full">
                  <label for="signup-email">البريد الإلكتروني</label>
                  <input id="signup-email" name="email" type="email" dir="ltr" autocomplete="email" inputmode="email" placeholder="name@example.com" aria-describedby="email-error" required />
                  <p id="email-error" class="field-error" hidden></p>
                </div>
                <div class="field">
                  <label for="signup-password">كلمة المرور</label>
                  <div class="password-field">
                    <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="أنشئ كلمة مرور" aria-describedby="password-error" required />
                    <button class="password-toggle" type="button" data-password-toggle aria-controls="signup-password" aria-pressed="false" aria-label="إظهار كلمة المرور">إظهار</button>
                  </div>
                  <p id="password-error" class="field-error" hidden></p>
                </div>
                <div class="field">
                  <label for="signup-confirm">تأكيد كلمة المرور</label>
                  <div class="password-field">
                    <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور" aria-describedby="confirm-error" required />
                    <button class="password-toggle" type="button" data-password-toggle aria-controls="signup-confirm" aria-pressed="false" aria-label="إظهار تأكيد كلمة المرور">إظهار</button>
                  </div>
                  <p id="confirm-error" class="field-error" hidden></p>
                </div>
              </div>
              <p class="auth-form-note">ستكون مدير منشأتك، ويمكنك دعوة فريقك بعد إنشائها.</p>
              <button class="btn btn-block auth-submit" type="submit">إنشاء الحساب</button>
            </form>
          </div>
          <div class="auth-card-footer"><p>لديك حساب بالفعل؟ <a href="./login.html">تسجيل الدخول</a></p></div>
        </section>
      </div>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
